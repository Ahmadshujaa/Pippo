org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options="-Xmx2G"
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable incremental compilation until the root cause of cache
# corruption is identified. Re-enable only after a clean successful build.
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false

# Performance optimizations
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Run Kotlin compiler in a separate process to avoid file-lock issues
# on Windows that corrupt the incremental PersistentMapImpl caches.
kotlin.compiler.execution.strategy=out-of-process
android.disableCheckAarMetadata=true
