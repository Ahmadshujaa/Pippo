name: tactics
description: "AtlasChess Runner Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  supabase_flutter: ^2.8.2
  app_links: ^7.2.1
  google_sign_in: ^7.2.0
  chess: ^0.8.1
  flutter_svg: ^2.0.9
  audioplayers: ^6.8.1
  path_provider: ^2.1.2
  onnxruntime: ^1.4.1
  flutter_dotenv: ^5.1.0

  # Local packages
  atlas_ui:
    path: ./packages/ui
  atlas_core:
    path: ./packages/atlas_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
